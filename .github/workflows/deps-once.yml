name: deps-once
on:
  push:
    branches: [ws/gemini-2-7]
    paths: ['.github/workflows/deps-once.yml']
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: add Expo-matched dependencies
        working-directory: mobile
        run: |
          npm ci
          npx expo install react-native-gesture-handler react-native-reanimated @gorhom/bottom-sheet expo-font
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "mobile: add gesture-handler, reanimated, bottom-sheet, expo-font (expo install)"
          git push
