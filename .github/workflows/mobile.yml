name: Native mobile checks
on:
  pull_request:
    paths: ['mobile/**', 'src/riyadh-metro.html', '.github/workflows/mobile.yml']
  push:
    branches: ['main', 'feat/android-offline-app']
    paths: ['mobile/**', 'src/riyadh-metro.html', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check:core
      - run: npm test
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:parity
      - run: npm run export:native
  android-preview:
    needs: shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: riyadh-metro-android-internal-preview
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
