# Daily copy of the visit statistics (GoatCounter API, read-only token in the GOATCOUNTER_TOKEN secret)
# and of Google Search Console data (service account key in the GSC_KEY secret; skipped if it is not set)
# to the `stats` branch, so the numbers can be read from the repository. Aggregate counts only.
name: Stats
on:
  schedule:
    - cron: '17 1 * * *'     # every day 05:17 Riyadh / Dubai time
    - cron: '47 * * * *'     # every hour: visits only (quick), so the JSON is never more than an hour old
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick refresh: visits only, skip Search Console (it updates once a day anyway)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency: stats
jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      GOAT_SITE: https://riyadhmetro.goatcounter.com
      SITE_HOST: riyadhmetro.fyi
      HAS_GSC: ${{ secrets.GSC_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Open the stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin stats; then
            git worktree add "$RUNNER_TEMP/w" FETCH_HEAD
            cd "$RUNNER_TEMP/w" && git checkout -B stats
          else
            git worktree add --detach "$RUNNER_TEMP/w"
            cd "$RUNNER_TEMP/w" && git checkout --orphan stats && git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
      - name: Download visit statistics
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          python3 tools/goat_stats.py --site "$GOAT_SITE" --out "$RUNNER_TEMP/stats" --days 30
          python3 tools/goat_stats.py --site "$GOAT_SITE" --out "$RUNNER_TEMP/stats-all" --days 365
          mv "$RUNNER_TEMP/stats-all/latest.json" "$RUNNER_TEMP/stats/year.json"
      - name: Download Search Console data
        if: env.HAS_GSC == 'true' && ((github.event_name == 'schedule' && github.event.schedule == '17 1 * * *') || (github.event_name == 'workflow_dispatch' && inputs.quick == false))
        continue-on-error: true
        env:
          GSC_KEY: ${{ secrets.GSC_KEY }}
        run: |
          pip install --quiet google-auth requests
          python3 tools/gsc_stats.py --host "$SITE_HOST" --sitemap sitemap.xml --prev "$RUNNER_TEMP/w" --out "$RUNNER_TEMP/stats" --inspect 150
      - name: Commit to the stats branch
        run: |
          cp "$RUNNER_TEMP"/stats/*.json "$RUNNER_TEMP/w/"
          cd "$RUNNER_TEMP/w"
          git add -A
          git commit -qm "stats $(date -u +%F)" || { echo "no change"; exit 0; }
          git push origin stats
